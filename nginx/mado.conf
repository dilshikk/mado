# ══════════════════════════════════════════════════════════════════════════════
# Nginx config — MADO (mado.uz + ftp.mado.uz)
# Server: aaPanel (BaoTa) — certs stored in /www/server/panel/vhost/cert/
#
# Install:
#   sudo cp nginx/mado.conf /www/server/panel/vhost/nginx/mado.conf
#   # OR paste contents into aaPanel → Website → Config
#   sudo nginx -t && sudo systemctl reload nginx
#
# Paths to adjust:
#   /www/wwwroot/mado/dist           → Vite build output
#   /www/wwwroot/mado/server/uploads → uploaded files folder
#   127.0.0.1:3000                   → Node.js port (matches server/.env PORT)
# ══════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mado.uz www.mado.uz ftp.mado.uz;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — mado.uz / www.mado.uz ────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mado.uz www.mado.uz;

    ssl_certificate     /www/server/panel/vhost/cert/mado.uz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mado.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    client_max_body_size 20M;

    access_log /www/wwwlogs/mado.log;
    error_log  /www/wwwlogs/mado.error.log warn;

    # API → Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Uploaded files — served directly from disk
    location /uploads/ {
        alias /www/wwwroot/mado/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        location ~* \.(php|cgi|sh|py)$ { deny all; }
    }

    # Static frontend (Vite build)
    root /www/wwwroot/mado/dist;
    index index.html;

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTPS — ftp.mado.uz ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ftp.mado.uz;

    ssl_certificate     /www/server/panel/vhost/cert/ftp.mado.uz/fullchain.pem;
