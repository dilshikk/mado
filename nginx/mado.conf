# ══════════════════════════════════════════════════════════════════════════════
# Nginx config — MADO (mado.uz + ftp.mado.uz)
#
# Install:
#   sudo cp nginx/mado.conf /etc/nginx/sites-available/mado
#   sudo ln -s /etc/nginx/sites-available/mado /etc/nginx/sites-enabled/mado
#   sudo nginx -t && sudo systemctl reload nginx
#
# Paths to adjust before using:
#   /var/www/mado/dist           → absolute path to your Vite build output
#   /var/www/mado/server/uploads → absolute path to uploaded files folder
#   127.0.0.1:3000               → Node.js server address (matches server/.env PORT)
#
# SSL notes:
#   mado.uz / www.mado.uz     → /etc/letsencrypt/live/mado.uz/
#   ftp.mado.uz               → /etc/letsencrypt/live/ftp.mado.uz/
#   To issue cert for ftp subdomain:
#     sudo certbot certonly --nginx -d ftp.mado.uz
# ══════════════════════════════════════════════════════════════════════════════

# ── Shared proxy + static settings (DRY) ─────────────────────────────────────
# These are referenced in both server blocks via include or repeated below.

# ── HTTP → HTTPS redirect (all domains) ──────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mado.uz www.mado.uz ftp.mado.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — mado.uz / www.mado.uz ────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mado.uz www.mado.uz;

    ssl_certificate     /etc/letsencrypt/live/mado.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mado.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mado.uz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    client_max_body_size 20M;

    access_log /var/log/nginx/mado.access.log;
    error_log  /var/log/nginx/mado.error.log warn;

    location /api/ {
        proxy_pass         http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    location /uploads/ {
        alias /var/www/mado/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        location ~* \.(php|cgi|sh|py)$ { deny all; }
    }

    root /var/www/mado/dist;
    index index.html;

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTPS — ftp.mado.uz ───────────────────────────────────────────────────────
# This is the subdomain used for the admin panel and dev access.
# Uses a separate SSL certificate — issue it with:
#   sudo certbot certonly --nginx -d ftp.mado.uz
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ftp.mado.uz;

    ssl_certificate     /etc/letsencrypt/live/ftp.mado.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ftp.mado.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ftp.mado.uz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    client_max_body_size 20M;

    access_log /var/log/nginx/mado-ftp.access.log;
    error_log  /var/log/nginx/mado-ftp.error.log warn;

    # API proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # Uploaded files
    location /uploads/ {
        alias /var/www/mado/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        location ~* \.(php|cgi|sh|py)$ { deny all; }
    }

    # Static frontend
    root /var/www/mado/dist;
    index index.html;

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
