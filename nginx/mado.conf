# ══════════════════════════════════════════════════════════════════════════════
# Nginx config — MADO (mado.uz + ftp.mado.uz)
# Server: aaPanel (BaoTa)
# Project root: /www/wwwroot/madouz/
#
# HOW TO USE (aaPanel way — do NOT replace aaPanel's SSL config):
#   Open aaPanel → Websites → mado.uz → Config
#   Add the location blocks below into the existing server { } block.
#   Do NOT replace the whole config — aaPanel manages SSL automatically.
#
# For ftp.mado.uz: create a separate site in aaPanel, issue SSL there,
#   then add the same location blocks.
# ══════════════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────────────
# PASTE THESE BLOCKS into aaPanel → Websites → mado.uz → Config
# inside the existing   server { ... }   block:
# ────────────────────────────────────────────────────────────────────────────
#
#   client_max_body_size 20M;
#
#   # API → Node.js backend
#   location /api/ {
#       proxy_pass         http://127.0.0.1:3000/api/;
#       proxy_http_version 1.1;
#       proxy_set_header Host              $host;
#       proxy_set_header X-Real-IP         $remote_addr;
#       proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_set_header Connection        "";
#       proxy_connect_timeout 10s;
#       proxy_send_timeout    60s;
#       proxy_read_timeout    60s;
#   }
#
#   # Uploaded files — serve from disk
#   location /uploads/ {
#       alias /www/wwwroot/madouz/server/uploads/;
#       expires 30d;
#       add_header Cache-Control "public, immutable";
#       access_log off;
#       location ~* \.(php|cgi|sh|py)$ { deny all; }
#   }
#
#   # SPA fallback (add to 伪静态 / Rewrite section or here)
#   location / {
#       try_files $uri $uri/ /index.html;
#   }
#
# ────────────────────────────────────────────────────────────────────────────
# The full standalone config below is for reference / manual Nginx setups.
# ────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mado.uz www.mado.uz ftp.mado.uz;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/madouz;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — mado.uz / www.mado.uz ────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mado.uz www.mado.uz;

    # aaPanel cert paths
    ssl_certificate     /www/server/panel/vhost/cert/mado.uz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mado.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    client_max_body_size 20M;

    access_log /www/wwwlogs/mado.log;
    error_log  /www/wwwlogs/mado.error.log warn;

    # API → Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Uploaded files
    location /uploads/ {
        alias /www/wwwroot/madouz/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        location ~* \.(php|cgi|sh|py)$ { deny all; }
    }

    root /www/wwwroot/madouz/dist;
    index index.html;

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTPS — ftp.mado.uz ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ftp.mado.uz;

    ssl_certificate     /www/server/panel/vhost/cert/ftp.mado.uz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ftp.mado.uz/privkey.pem;

