# ══════════════════════════════════════════════════════════════════════════════
# Nginx config — MADO (mado.uz)
#
# Install:
#   sudo cp nginx/mado.conf /etc/nginx/sites-available/mado
#   sudo ln -s /etc/nginx/sites-available/mado /etc/nginx/sites-enabled/mado
#   sudo nginx -t && sudo systemctl reload nginx
#
# Paths to adjust before using:
#   /var/www/mado/dist        → absolute path to your Vite build output
#   /var/www/mado/server/uploads → absolute path to uploaded files folder
#   127.0.0.1:3000            → Node.js server address (matches server/.env PORT)
# ══════════════════════════════════════════════════════════════════════════════

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mado.uz www.mado.uz;

    # Let's Encrypt ACME challenge (certbot uses this path)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — main site ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mado.uz www.mado.uz;

    # ── SSL certificates (issued by certbot / Let's Encrypt) ──────────────
    ssl_certificate     /etc/letsencrypt/live/mado.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mado.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mado.uz/chain.pem;

    # ── Modern SSL settings ───────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ── Client body size (file uploads) ───────────────────────────────────
    client_max_body_size 20M;

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/mado.access.log;
    error_log  /var/log/nginx/mado.error.log warn;

    # ── 1. API — proxy to Node.js backend ────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection alive to Node.js
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings (good for JSON APIs)
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;
    }

    # ── 2. Uploaded files — serve directly from disk ──────────────────────
    # Node.js writes uploads to server/uploads/; serve them via Nginx for speed.
    location /uploads/ {
        alias /var/www/mado/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Security: only allow images and a few safe types
        location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
            expires 30d;
        }
        location ~* \.(php|cgi|sh|py)$ {
            deny all;
        }
    }

    # ── 3. Static frontend (Vite build output) ────────────────────────────
    root /var/www/mado/dist;
    index index.html;

    # Immutable assets (Vite adds content hash to filenames)
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback — all unmatched routes → index.html (React Router handles routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
