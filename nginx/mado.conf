        access_log off;
        location ~* \.(php|cgi|sh|py)$ { deny all; }
    }

    root /www/wwwroot/madouz/dist;
    index index.html;

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
